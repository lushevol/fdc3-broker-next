# Azure DevOps Pipeline for PR Validation
# This pipeline validates PRs and checks for changesets

trigger: none

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

jobs:
  - job: Validate
    displayName: 'Validate PR'
    steps:
      - checkout: self
        fetchDepth: 0

      - task: NodeTool@0
        inputs:
          versionSpec: '20.x'
        displayName: 'Install Node.js'

      - script: npm ci
        displayName: 'Install Dependencies'

      - script: npm run build:packages
        displayName: 'Build Packages'

      - script: npm run test
        displayName: 'Run Tests'

      - script: |
          # Get list of changed files compared to main
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD)

          # Check if any package files changed
          PACKAGE_CHANGES=$(echo "$CHANGED_FILES" | grep -E "^packages/.*\.(ts|tsx|js|jsx|json)$" || true)

          if [ -n "$PACKAGE_CHANGES" ]; then
            echo "Package changes detected:"
            echo "$PACKAGE_CHANGES"
            
            # Check if there's a changeset
            CHANGESET_FILES=$(echo "$CHANGED_FILES" | grep -E "^\.changeset/.*\.md$" | grep -v "README.md" || true)
            
            if [ -z "$CHANGESET_FILES" ]; then
              echo ""
              echo "##[warning]Package files changed but no changeset found."
              echo "If this change should trigger a release, please run 'npm run changeset' to add one."
              echo ""
              echo "To add a changeset:"
              echo "  1. Run: npm run changeset"
              echo "  2. Select the packages that changed"
              echo "  3. Choose the version bump type (patch/minor/major)"
              echo "  4. Write a brief description of the change"
            else
              echo "##[section]Changeset found: $CHANGESET_FILES"
            fi
          else
            echo "No package source files changed - changeset not required."
          fi
        displayName: 'Check for Changesets'
