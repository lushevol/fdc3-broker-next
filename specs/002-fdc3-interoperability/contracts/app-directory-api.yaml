openapi: 3.0.3
info:
  title: FDC3 App Directory API
  description: |
    REST API for the FDC3 App Directory service.
    This service stores metadata about FDC3-enabled applications and provides
    query endpoints filtered by user entitlements.
  version: 2.0.0
  contact:
    name: FDC3 App Directory
    url: https://fdc3.finos.org
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: https://app-directory.example.com/api
    description: Production server
  - url: http://localhost:3000/api
    description: Development mock server

security:
  - BearerAuth: []

tags:
  - name: applications
    description: Application metadata operations
  - name: health
    description: Health check endpoints

paths:
  /v2/apps:
    get:
      tags:
        - applications
      summary: Get all applications
      description: |
        Retrieve all application definitions that the authenticated user is entitled to access.
        If no authentication token is provided, returns only public applications.
      operationId: getAllApps
      parameters:
        - name: category
          in: query
          description: Filter by category
          schema:
            type: string
          example: Analytics
        - name: intent
          in: query
          description: Filter by intent type (apps that handle this intent)
          schema:
            type: string
          example: ViewChart
        - name: contextType
          in: query
          description: Filter by context type (apps that handle this context)
          schema:
            type: string
          example: fdc3.instrument
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AppDefinition'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v2/apps/{appId}:
    get:
      tags:
        - applications
      summary: Get application by ID
      description: |
        Retrieve a specific application definition by appId.
        Returns null if the app doesn't exist or user is not entitled.
      operationId: getApp
      parameters:
        - name: appId
          in: path
          required: true
          description: Application identifier
          schema:
            type: string
          example: my-chart-app
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppDefinition'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /health:
    get:
      tags:
        - health
      summary: Health check
      description: Check if the service is healthy
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: OK
                  version:
                    type: string
                    example: 2.0.0

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token for authentication and entitlement filtering

  schemas:
    AppDefinition:
      type: object
      required:
        - appId
        - name
        - version
      properties:
        appId:
          type: string
          description: Unique application identifier
          example: my-chart-app
        name:
          type: string
          description: Application name
          example: Advanced Chart
        version:
          type: string
          description: Application version
          example: 1.2.0
        title:
          type: string
          description: Short title
          example: Chart
        description:
          type: string
          description: Application description
          example: Advanced financial charting application
        icons:
          type: array
          description: Application icons
          items:
            type: object
            properties:
              src:
                type: string
                example: https://example.com/icons/chart.png
              size:
                type: string
                example: 64x64
              type:
                type: string
                example: image/png
        images:
          type: array
          description: Application screenshots
          items:
            type: object
            properties:
              src:
                type: string
                example: https://example.com/screenshots/chart.png
              size:
                type: string
                example: 1024x768
        categories:
          type: array
          description: Application categories
          items:
            type: string
          example: [Analytics, Charting]
        lang:
          type: string
          description: Default language
          example: en
        localizedVersions:
          type: array
          description: Localized versions
          items:
            type: object
            properties:
              lang:
                type: string
                example: fr
              name:
                type: string
                example: Graphique avancé
              description:
                type: string
                example: Application de graphique financier avancé
        interop:
          $ref: '#/components/schemas/InteropConfig'
        entitlementConstraints:
          $ref: '#/components/schemas/EntitlementConstraints'

    InteropConfig:
      type: object
      description: FDC3 interoperability configuration
      properties:
        intents:
          type: object
          properties:
            listensFor:
              type: array
              description: Intents this app handles
              items:
                type: object
                required:
                  - intent
                properties:
                  intent:
                    type: string
                    description: Intent type
                    example: ViewChart
                  contexts:
                    type: array
                    description: Accepted context types
                    items:
                      type: string
                    example: [fdc3.instrument, fdc3.portfolio]
                  resultType:
                    type: string
                    description: Expected result type
                    example: fdc3.chart
            raises:
              type: array
              description: Intents this app raises
              items:
                type: object
                required:
                  - intent
                properties:
                  intent:
                    type: string
                    example: ViewOrder
                  contexts:
                    type: array
                    items:
                      type: string
                    example: [fdc3.instrument]

    EntitlementConstraints:
      type: object
      description: Entitlement constraints
      properties:
        requiredPermissions:
          type: array
          description: Required user permissions
          items:
            type: string
          example: [view-charts, advanced-analytics]
        userGroups:
          type: array
          description: Allowed user groups
          items:
            type: string
          example: [Premium, Enterprise]
        minAccessLevel:
          type: string
          description: Minimum access level required
          example: trader
          enum: [viewer, analyst, trader, admin]

    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Error code
          example: APP_NOT_FOUND
        message:
          type: string
          description: Error message
          example: Application not found or user not entitled
        details:
          type: object
          description: Additional error details
          additionalProperties: true

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: APP_NOT_FOUND
            message: Application not found or user not entitled

    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: UNAUTHORIZED
            message: Authentication required or invalid token

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INTERNAL_ERROR
            message: An unexpected error occurred
