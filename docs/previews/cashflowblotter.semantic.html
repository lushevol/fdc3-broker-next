<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FMO Post Trade Portal - Cashflow Blotter</title>
    <link rel="stylesheet" href="./cashflowblotter.semantic.css" />
    <script defer src="./components/site-topbar.component.js"></script>
    <script defer src="./components/quick-search-form.component.js"></script>
    <script defer src="./components/results-toolbar.component.js"></script>
    <script defer src="./components/data-grid-shell.component.js"></script>
  </head>
  <body class="portal">
    <site-topbar
      title="FMO Post Trade Portal"
      tile-label="New Tile"
      theme-label="Dark"
      theme-checked="false"
      time-value="01:47 UTC"
      time-label="UTC"
      time-checked="true"
      profile-label="Profile"
      feedback-label="Feedback"
    ></site-topbar>

    <main class="portal__main workspace" id="main-content">
      <section class="workspace__tabs tabs" aria-label="Workspaces">
        <nav class="tabs__nav" aria-label="Workspace tabs">
          <button class="tabs__tab tabs__tab--active" type="button" aria-selected="true">Cashflow Blotter</button>
          <button class="tabs__add-button" type="button" aria-label="Add workspace">Add</button>
        </nav>
      </section>

      <article class="workspace__panel cashflow" aria-labelledby="cashflow-page-title">
        <header class="cashflow__meta page-meta">
          <h2 id="cashflow-page-title" class="visually-hidden">Cashflow Blotter Workspace</h2>

          <dl class="page-meta__version" aria-label="Application version">
            <div class="page-meta__item">
              <dt class="page-meta__term">Version</dt>
              <dd class="page-meta__value">1.39.0-v1.39.0-20260115.1</dd>
            </div>
            <div class="page-meta__item">
              <dt class="page-meta__term">Environment</dt>
              <dd class="page-meta__value">PROD</dd>
            </div>
          </dl>

          <div class="page-meta__actions">
            <button class="button button--outline" type="button">API Status</button>
            <button class="button button--outline" type="button">Refresh Page</button>
          </div>
        </header>

        <quick-search-form
          quick-title="Quick Search"
          custom-title="Custom Search/View"
          toggle-label="Hide Search Bar"
          filters-label="Filters"
          views-label="Views"
          clear-label="Clear"
          modify-label="Create or Modify"
          search-label="Search"
          reset-label="Clear Filters"
          today-title="Value Today"
          tomorrow-title="Value Tomorrow"
          today-operator-count="1"
          today-verification-count="1"
          tomorrow-operator-count="0"
          tomorrow-verification-count="0"
        ></quick-search-form>

        <results-toolbar
          title="Results"
          current-count="1139"
          total-count="52959"
          load-next-label="Load next 1000"
          settings-label="Settings"
          info-message="If more than 1000 records are loaded, column filters below will be applied only within the first 1000 records."
          resize-label="Resize"
          export-label="Export File"
        ></results-toolbar>

        <data-grid-shell
          title="Cashflow Blotter Grid"
          columns='["Select","Cashflow Id","Cashflow State","Trade Id","Value Date","Currency","Amount"]'
          empty-message="Grid rows rendered by application runtime."
        ></data-grid-shell>
      </article>
    </main>
  </body>
</html>
