#Web Engineering NGINX Configuration Template for NGINX-SSL Instance.
user nginxadm;
worker_processes auto;
error_log /apps/support/logs/nginx/nginx-DEV_RATAN_UK_01/error.log error;
pid /apps/nginx/instances/nginx-DEV_RATAN_UK_01/run/nginx.pid;
events {
    worker_connections 512;
    use epoll;
    multi_accept on;
}

http {
    client_body_temp_path /tmp 1 2;
    proxy_temp_path /apps/nginx/instances/nginx-DEV_RATAN_UK_01/cache 1 2;
    fastcgi_temp_path /tmp 1 2;
    uwsgi_temp_path /tmp 1 2;
    scgi_temp_path /tmp 1 2; 
    log_format compression '$remote_addr - $remote_user [$time_local] ' '"$request" $status $body_bytes_sent ' '"$http_referer" "$http_user_agent" "$gzip_ratio"';
    access_log /apps/support/logs/nginx/nginx-DEV_RATAN_UK_01/access.log compression;
    server_tokens off;
    autoindex off;
    disable_symlinks on from=$document_root;
    open_file_cache max=50000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;
    reset_timedout_connection on;
    sendfile off;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_requests 100;
    keepalive_timeout 20;
    types_hash_max_size 2048;
    include /apps/nginx/instances/nginx-DEV_RATAN_UK_01/mime.types;
    default_type application/octet-stream;
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:20m;
    limit_req_zone $binary_remote_addr zone=req_limit_per_ip:20m rate=30r/s;
    limit_req_status 444;
    limit_conn_status 503;
    underscores_in_headers on;

    #Test
    # request time out -- default 60 
    client_body_timeout 10s;
    client_header_timeout 10s;
    # if client stop responding, free up memory -- default 60 
    send_timeout 90; 
    client_max_body_size 4M; 
    limit_conn_zone $server_name zone=servers:10m; 
    limit_req_zone $binary_remote_addr zone=fifty:10m rate=50r/s; 

    #buffer size for MFE
    proxy_busy_buffers_size   512k;
    proxy_buffers   4 512k;
    proxy_buffer_size   256k;

    gzip                      on;
    gzip_vary                 on;
    gzip_proxied              any;
    gzip_comp_level           6;
    gzip_disable              "MSIE [1-6]\.";
    gzip_http_version         1.1;
    gzip_types                text/plain text/css application/json application/x-javascript text/xml application/xml application/xml+rss text/javascript application/javascript;
    

server {
        listen       8463 ssl;
        ssl on;
        ssl_session_tickets off;
        ssl_certificate             /apps/nginx/instances/nginx-DEV_RATAN_UK_01/ssl/nginx-DEV_RATAN_UK_01.crt;
        ssl_certificate_key         /apps/nginx/instances/nginx-DEV_RATAN_UK_01/ssl/nginx-DEV_RATAN_UK_01.key;
        ssl_session_timeout         5m;
        ssl_trusted_certificate     /apps/nginx/instances/nginx-DEV_RATAN_UK_01/ssl/rootca.pem;
        ssl_protocols TLSv1.2;
        ssl_ciphers "EECDH+ECDSA+AESGCM EECDH+aRSA+AESGCM EECDH+ECDSA+SHA384";
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_dhparam /apps/nginx/instances/nginx-DEV_RATAN_UK_01/ssl/dhparams.pem;


        limit_conn conn_limit_per_ip 50;
        limit_req zone=req_limit_per_ip burst=20 nodelay;
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Frame-Options SAMEORIGIN;
        add_header Last-Modified "";
        add_header ETag "";
        add_header X-Content-Type-Options nosniff;
        add_header Content-Security-Policy "default-src 'self'";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        if ($time_iso8601 ~ "^(?<year>\d{4})-(?<month>\d{2})-(?<day>\d{2})") {}
        if ($request_method ~ ^(TRACE|TRACK|DELETE|OPTIONS)$) {
            return 444;
        }
        client_body_buffer_size 8K;
        client_max_body_size 20m;
        client_body_timeout 10s;
        client_header_buffer_size 1k;
        large_client_header_buffers 2 16k;
        client_header_timeout 5s;
        keepalive_timeout 40;
        error_page 500 404 401 402 403 405 501 503 /Error.html;
        location = /Error.html {
            root /apps/nginx/instances/nginx-DEV_RATAN_UK_01/www/html;
            internal;
        }
        location = /robots.txt {
            add_header Content-Type text/plain;
            return 200 "User-agent: *\nDisallow: /\n";
        }
    }


    # Load configuration files
    include config-ratan/ratan.conf;
    include config-ratan/ratan_mock.conf;
    include config-ratan/fmo_static_mappings.conf;
    include config-ratan/tcas_uploader.conf;
    include config-ratan/trade-exception.conf;
    include config-ratan/oscar-dialog.conf;
    include config-ratan/mfe.conf;
}
