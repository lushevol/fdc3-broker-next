scb:
  fmaa:
    host: ${FMAA_HOST}
    verificationPath: ${scb.fmaa.host}/introspect?app_id=FMO_PORTAL&access_token=%s
    connectTimeout: 5000 #ms
    readTimeout: 5000 #ms
    creationEnabled: false
  ems2:
    cachingEnabled: true
    newApiEnabled: true
    expiryTime: 60 #seconds
    host: ${EMS2_HTTPS_HOST}
    userRoles: ${scb.ems2.host}/ems2/rest/account/%s
    newUserAuthorizationOnEntity: ${scb.ems2.host}/ems2/rest/entitlements/entitlementList
    adminModuleEntity: FMO PORTAL ADMIN
  mfa:
    headers:
      X-Cert: ${MFA_CERT}
    accessToken: /access_token
    connectTimeout: 10 #seconds
    readTimeout: 30 #seconds
    redirectUri: ${MFA_REDIRECT_URI}
    grantType: authorization_code

ratanone:
  security:
    auth-service: lb://SINGLE-UI-BFF
    token-header-name: x-token
  open-apis:
    auto-startup: true
    api-gateway-url: ${API_GATEWAY_URL}
    api-gateway-token: ${API_GATEWAY_TOKEN}
    apis:
      - name: single-ui-bff@extend
        skipApiDefinitionValidation: true
        entrypoint:
          method: POST
          path: /v2/sso/extend
        endpoint:
          service: lb://SINGLE-UI-BFF
          path: /v2/sso/extend
        auth:
          required: false
        audit:
          type: Access
          action: Extend
      - name: single-ui-bff@refreshtoken
