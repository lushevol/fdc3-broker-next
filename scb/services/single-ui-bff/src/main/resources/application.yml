scb:
  fmaa:
    host: ${FMAA_HOST}
    verificationPath: ${scb.fmaa.host}/introspect?app_id=FMO_PORTAL&access_token=%s
    connectTimeout: 5000 #ms
    readTimeout: 5000 #ms
    creationEnabled: false
  ems2:
    cachingEnabled: true
    newApiEnabled: true
    expiryTime: 60 #seconds
    host: ${EMS2_HTTPS_HOST}
    userRoles: ${scb.ems2.host}/ems2/rest/account/%s
    newUserAuthorizationOnEntity: ${scb.ems2.host}/ems2/rest/entitlements/entitlementList
    adminModuleEntity: FMO PORTAL ADMIN
  ems3:
    # Grant URLs are bases before /{userId}; token URL is the full OAuth endpoint.
    # Credentials are supplied by the secret store.
    # Empty settings allow EMS2-only startup. They are checked when EMS3 is selected.
    token-url: ${EMS3_TOKEN_URL:}
    detail-url: ${EMS3_DETAIL_URL:}
    aggregate-url: ${EMS3_AGGREGATE_URL:}
    client-id: ${EMS3_CLIENT_ID:}
    client-secret: ${EMS3_CLIENT_SECRET:}
    scope: ${EMS3_SCOPE:}
    connect-timeout: ${EMS3_CONNECT_TIMEOUT:2s}
    read-timeout: ${EMS3_READ_TIMEOUT:5s}
    token-proxy-host: ${EMS3_TOKEN_PROXY_HOST:}
    token-proxy-port: ${EMS3_TOKEN_PROXY_PORT:0}
    allow-insecure-localhost: false
  mfa:
    headers:
      X-Cert: ${MFA_CERT}
    accessToken: /access_token
    connectTimeout: 10 #seconds
    readTimeout: 30 #seconds
    redirectUri: ${MFA_REDIRECT_URI}
    grantType: authorization_code

ratanone:
  security:
    auth-service: lb://SINGLE-UI-BFF
    token-header-name: x-token
  open-apis:
    auto-startup: true
    api-gateway-url: ${API_GATEWAY_URL}
    api-gateway-token: ${API_GATEWAY_TOKEN}
    apis:
      - name: single-ui-bff@extend
        skipApiDefinitionValidation: true
        entrypoint:
          method: POST
          path: /v2/sso/extend
        endpoint:
          service: lb://SINGLE-UI-BFF
          path: /v2/sso/extend
        auth:
          required: false
        audit:
