<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ant Design v6 Design Token Demo</title>
  <!-- Ant Design v6 CSS -->
  <link rel="stylesheet" href="https://unpkg.com/antd@6/dist/reset.css">
  <!-- React -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Ant Design v6 -->
  <script src="https://unpkg.com/dayjs@1/dayjs.min.js"></script>
  <script src="https://unpkg.com/antd@6/dist/antd.min.js" crossorigin></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }
    .theme-toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 1000;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;
    const {
      ConfigProvider,
      theme,
      Button,
      Card,
      Input,
      Space,
      Typography,
      Divider,
      Tag,
      Alert,
      Switch,
      Slider,
      Progress,
      Table,
      Badge,
      Avatar,
      Rate,
      Segmented,
      Tooltip,
      message,
      App
    } = antd;

    const { Title, Text, Paragraph } = Typography;

    // ============================================
    // GDS Design Tokens - Mapped to Ant Design v6
    // ============================================

    // Primary colors from GDS
    const gdsColors = {
      // Brand colors
      brandBlue: '#0473ea',
      brandGreen: '#38d200',
      prosperBlue: '#020b43',

      // Blue scale for primary actions
      blue: {
        50: '#e5f1fc',
        100: '#cce3fa',
        200: '#9ac7f6',
        300: '#68abf2',
        400: '#368fee',
        500: '#0473ea',
        600: '#035cbb',
        700: '#02458c',
        800: '#012e5d',
      },

      // Semantic colors
      success: '#38d200',
      warning: '#faad14',
      error: '#e00a15',
      info: '#0473ea',

      // Grey scale
      grey: {
        50: '#f2f2f2',
        100: '#e5e5e5',
        200: '#cccccc',
        300: '#b2b2b2',
        400: '#999999',
        500: '#808080',
        600: '#666666',
        700: '#4d4d4d',
        800: '#333333',
        900: '#1a1a1a',
      }
    };

    // Light Theme Configuration
    const lightThemeConfig = {
      token: {
        // Seed Tokens - Primary brand
        colorPrimary: gdsColors.brandBlue,
        colorSuccess: gdsColors.success,
        colorWarning: gdsColors.warning,
        colorError: gdsColors.error,
        colorInfo: gdsColors.info,

        // Background colors
        colorBgBase: '#ffffff',
        colorBgContainer: '#ffffff',
        colorBgElevated: '#ffffff',
        colorBgLayout: gdsColors.grey[50],

        // Text colors
        colorText: gdsColors.grey[900],
        colorTextSecondary: gdsColors.grey[600],
        colorTextTertiary: gdsColors.grey[500],
        colorTextQuaternary: gdsColors.grey[400],

        // Border colors
        colorBorder: gdsColors.grey[200],
        colorBorderSecondary: gdsColors.grey[100],

        // Link colors
        colorLink: gdsColors.blue[500],
        colorLinkHover: gdsColors.blue[400],
        colorLinkActive: gdsColors.blue[600],

        // Font
        fontFamily: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif",
        fontSize: 14,

        // Border radius
        borderRadius: 6,
        borderRadiusLG: 8,
        borderRadiusSM: 4,

        // Motion
        motionDurationFast: '0.1s',
        motionDurationMid: '0.2s',
        motionDurationSlow: '0.3s',

        // Control height
        controlHeight: 32,
        controlHeightLG: 40,
        controlHeightSM: 24,

        // Focus
        colorPrimaryBorder: gdsColors.brandBlue,
        colorPrimaryBorderHover: gdsColors.blue[400],
      },
      components: {
        Button: {
          primaryShadow: 'none',
          defaultShadow: 'none',
          dangerShadow: 'none',
        },
        Card: {
          boxShadowTertiary: '0 1px 2px 0 rgba(0, 0, 0, 0.03), 0 1px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px 0 rgba(0, 0, 0, 0.02)',
        },
        Input: {
          activeShadow: `0 0 0 2px rgba(4, 115, 234, 0.1)`,
          hoverBorderColor: gdsColors.brandBlue,
        },
        Table: {
          headerBg: gdsColors.grey[50],
          rowHoverBg: gdsColors.grey[50],
        },
        Tag: {
          defaultBg: gdsColors.grey[50],
        },
      },
    };

    // Dark Theme Configuration
    const darkThemeConfig = {
      algorithm: theme.darkAlgorithm,
      token: {
        // Seed Tokens - Primary brand (adjusted for dark mode)
        colorPrimary: '#368fee', // Lighter blue for dark mode
        colorSuccess: '#5fdf37',
        colorWarning: '#fbbd43',
        colorError: '#e63b44',
        colorInfo: '#368fee',

        // Background colors
        colorBgBase: '#1a1a1a',
        colorBgContainer: '#262626',
        colorBgElevated: '#333333',
        colorBgLayout: '#0d0d0d',

        // Text colors
        colorText: gdsColors.grey[100],
        colorTextSecondary: gdsColors.grey[300],
        colorTextTertiary: gdsColors.grey[400],
        colorTextQuaternary: gdsColors.grey[500],

        // Border colors
        colorBorder: '#4d4d4d',
        colorBorderSecondary: '#333333',

        // Link colors
        colorLink: gdsColors.blue[200],
        colorLinkHover: gdsColors.blue[100],
        colorLinkActive: gdsColors.blue[300],

        // Font
        fontFamily: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif",
        fontSize: 14,

        // Border radius
        borderRadius: 6,
        borderRadiusLG: 8,
        borderRadiusSM: 4,

        // Control height
        controlHeight: 32,
        controlHeightLG: 40,
        controlHeightSM: 24,

        // Focus
        colorPrimaryBorder: '#368fee',
        colorPrimaryBorderHover: '#68abf2',
      },
      components: {
        Button: {
          primaryShadow: 'none',
          defaultShadow: 'none',
          dangerShadow: 'none',
          defaultBg: '#333333',
          defaultBorderColor: '#4d4d4d',
          defaultColor: gdsColors.grey[100],
        },
        Card: {
          colorBgContainer: '#262626',
          colorBorderSecondary: '#333333',
        },
        Input: {
          colorBgContainer: '#1a1a1a',
          colorBorder: '#4d4d4d',
          activeShadow: `0 0 0 2px rgba(54, 143, 238, 0.2)`,
          hoverBorderColor: '#368fee',
        },
        Table: {
          headerBg: '#262626',
          rowHoverBg: '#333333',
          colorBgContainer: '#1a1a1a',
        },
        Tag: {
          defaultBg: '#333333',
        },
      },
    };

    // Demo Components
    const TokenDemo = () => {
      return (
        <Card title="Design Tokens" style={{ marginBottom: 24 }}>
          <Space direction="vertical" style={{ width: '100%' }} size="large">
            <div>
              <Text strong>Color Primary:</Text>
              <div style={{ display: 'flex', gap: 8, marginTop: 8 }}>
                <div style={{ width: 40, height: 40, background: 'var(--ant-color-primary)', borderRadius: 4 }} />
                <div style={{ width: 40, height: 40, background: 'var(--ant-color-primary-bg)', borderRadius: 4 }} />
                <div style={{ width: 40, height: 40, background: 'var(--ant-color-primary-border)', borderRadius: 4 }} />
              </div>
            </div>
            <div>
              <Text strong>Semantic Colors:</Text>
              <div style={{ display: 'flex', gap: 8, marginTop: 8 }}>
                <div style={{ width: 40, height: 40, background: 'var(--ant-color-success)', borderRadius: 4 }} title="Success" />
                <div style={{ width: 40, height: 40, background: 'var(--ant-color-warning)', borderRadius: 4 }} title="Warning" />
                <div style={{ width: 40, height: 40, background: 'var(--ant-color-error)', borderRadius: 4 }} title="Error" />
                <div style={{ width: 40, height: 40, background: 'var(--ant-color-info)', borderRadius: 4 }} title="Info" />
              </div>
            </div>
          </Space>
        </Card>
      );
    };

    const ButtonDemo = () => {
      return (
        <Card title="Buttons" style={{ marginBottom: 24 }}>
          <Space wrap>
            <Button type="primary">Primary</Button>
            <Button>Default</Button>
            <Button type="dashed">Dashed</Button>
            <Button type="text">Text</Button>
            <Button type="link">Link</Button>
            <Button danger>Danger</Button>
            <Button type="primary" danger>Primary Danger</Button>
          </Space>
          <Divider />
          <Space wrap>
            <Button type="primary" size="small">Small</Button>
            <Button type="primary" size="middle">Middle</Button>
            <Button type="primary" size="large">Large</Button>
          </Space>
        </Card>
      );
    };

    const InputDemo = () => {
      return (
        <Card title="Inputs" style={{ marginBottom: 24 }}>
          <Space direction="vertical" style={{ width: '100%' }}>
            <Input placeholder="Basic input" />
            <Input.Password placeholder="Password input" />
            <Input.Search placeholder="Search input" enterButton="Search" />
            <Input.TextArea placeholder="Text area" rows={3} />
          </Space>
        </Card>
      );
    };

    const DataDisplayDemo = () => {
      const columns = [
        { title: 'Name', dataIndex: 'name', key: 'name' },
        { title: 'Age', dataIndex: 'age', key: 'age' },
        { title: 'Status', dataIndex: 'status', key: 'status', render: (status) => (
          <Tag color={status === 'Active' ? 'success' : 'warning'}>{status}</Tag>
        )},
      ];

      const data = [
        { key: '1', name: 'John Doe', age: 32, status: 'Active' },
        { key: '2', name: 'Jane Smith', age: 28, status: 'Pending' },
        { key: '3', name: 'Bob Wilson', age: 45, status: 'Active' },
      ];

      return (
        <Card title="Data Display" style={{ marginBottom: 24 }}>
          <Space direction="vertical" style={{ width: '100%' }} size="large">
            <div>
              <Text strong>Tags:</Text>
              <div style={{ marginTop: 8 }}>
                <Space>
                  <Tag>Default</Tag>
                  <Tag color="success">Success</Tag>
                  <Tag color="warning">Warning</Tag>
                  <Tag color="error">Error</Tag>
                  <Tag color="processing">Processing</Tag>
                </Space>
              </div>
            </div>
            <div>
              <Text strong>Progress & Rate:</Text>
              <div style={{ marginTop: 8 }}>
                <Progress percent={75} style={{ maxWidth: 300 }} />
                <Rate defaultValue={3} />
              </div>
            </div>
            <div>
              <Text strong>Table:</Text>
              <div style={{ marginTop: 8 }}>
                <Table columns={columns} dataSource={data} pagination={false} size="small" />
              </div>
            </div>
          </Space>
        </Card>
      );
    };

    const FeedbackDemo = () => {
      const [messageApi, contextHolder] = message.useMessage();

      return (
        <Card title="Feedback" style={{ marginBottom: 24 }}>
          {contextHolder}
          <Space direction="vertical" style={{ width: '100%' }}>
            <Space direction="vertical" style={{ width: '100%' }}>
              <Alert message="Success message" type="success" showIcon />
              <Alert message="Warning message" type="warning" showIcon />
              <Alert message="Error message" type="error" showIcon />
              <Alert message="Info message" type="info" showIcon />
            </Space>
            <Divider />
            <Space>
              <Button onClick={() => messageApi.success('Success!')}>Show Success</Button>
              <Button onClick={() => messageApi.warning('Warning!')}>Show Warning</Button>
              <Button onClick={() => messageApi.error('Error!')}>Show Error</Button>
            </Space>
          </Space>
        </Card>
      );
    };

    const NavigationDemo = () => {
      return (
        <Card title="Navigation" style={{ marginBottom: 24 }}>
          <Space direction="vertical" style={{ width: '100%' }}>
            <Text strong>Segmented:</Text>
            <Segmented
              options={['Daily', 'Weekly', 'Monthly', 'Yearly']}
              defaultValue="Weekly"
            />
            <Divider />
            <Text strong>Badges & Avatars:</Text>
            <Space size="large">
              <Badge count={5}>
                <Avatar shape="square" size="large" />
              </Badge>
              <Badge dot>
                <Avatar shape="square" size="large" />
              </Badge>
              <Avatar.Group>
                <Avatar style={{ backgroundColor: gdsColors.brandBlue }}>A</Avatar>
                <Avatar style={{ backgroundColor: gdsColors.success }}>B</Avatar>
                <Tooltip title="Ant User">
                  <Avatar style={{ backgroundColor: gdsColors.warning }}>C</Avatar>
                </Tooltip>
              </Avatar.Group>
            </Space>
          </Space>
        </Card>
      );
    };

    const NestedThemeDemo = () => {
      return (
        <Card title="Nested Theme (Override)" style={{ marginBottom: 24 }}>
          <Text type="secondary">
            ConfigProvider supports nested themes. Child themes inherit from parent and can override tokens.
          </Text>
          <Divider />
          <Space direction="vertical" style={{ width: '100%' }}>
            <Button type="primary">Default Primary Button</Button>
            <ConfigProvider theme={{
              token: {
                colorPrimary: gdsColors.success,
                borderRadius: 16,
              }
            }}>
              <Button type="primary">Green Theme Button (Nested)</Button>
            </ConfigProvider>
            <ConfigProvider theme={{
              token: {
                colorPrimary: gdsColors.warning,
                borderRadius: 24,
              }
            }}>
              <Button type="primary">Orange Theme Button (Nested)</Button>
            </ConfigProvider>
          </Space>
        </Card>
      );
    };

    // Main App
    const DemoApp = () => {
      const [isDark, setIsDark] = useState(false);

      return (
        <ConfigProvider theme={isDark ? darkThemeConfig : lightThemeConfig}>
          <App>
            <div
              style={{
                minHeight: '100vh',
                padding: 24,
                backgroundColor: isDark ? '#0d0d0d' : gdsColors.grey[50],
              }}
            >
              {/* Theme Toggle */}
              <div className="theme-toggle">
                <Space>
                  <Text style={{ color: isDark ? '#fff' : undefined }}>Dark Mode</Text>
                  <Switch
                    checked={isDark}
                    onChange={setIsDark}
                    checkedChildren="Dark"
                    unCheckedChildren="Light"
                  />
                </Space>
              </div>

              {/* Header */}
              <div style={{ marginBottom: 24, marginTop: 48 }}>
                <Title level={2}>Ant Design v6 Design Token Demo</Title>
                <Paragraph type="secondary">
                  Demonstrating GDS design tokens mapped to Ant Design's ConfigProvider theme system.
                  Toggle between light and dark themes to see token changes.
                </Paragraph>
              </div>

              {/* Demo Sections */}
              <div style={{ maxWidth: 1200, margin: '0 auto' }}>
                <Space direction="vertical" style={{ width: '100%' }} size="large">
                  <TokenDemo />
                  <ButtonDemo />
                  <InputDemo />
                  <DataDisplayDemo />
                  <FeedbackDemo />
                  <NavigationDemo />
                  <NestedThemeDemo />
                </Space>
              </div>

              {/* Footer */}
              <Divider />
              <div style={{ textAlign: 'center' }}>
                <Text type="secondary">
                  Built with Ant Design v6 ConfigProvider and GDS Design Tokens
                </Text>
              </div>
            </div>
          </App>
        </ConfigProvider>
      );
    };

    // Render
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<DemoApp />);
  </script>
</body>
</html>
