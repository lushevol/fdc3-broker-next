<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, initial-scale=1.0">
  <title>Cashflow Blotter - Scratch Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            slate: {
              850: '#1e293b',
              900: '#0f172a',
              950: '#020617',
            },
            primary: {
              50: '#e0f2fe',
              100: '#bae6fd',
              200: '#7dd3fc',
              300: '#38bdf8',
              400: '#0ea5e9',
              500: '#0284c7',
              600: '#0369a1',
              700: '#075985',
              800: '#0c4a6e',
              900: '#082f49',
              950: '#082a45',
            },
            prosper: {
              500: '#0473ea',
              600: '#0360c2',
              700: '#024d9b',
            },
            success: {
              500: '#10b981',
              600: '#059669',
            },
            warning: {
              500: '#f59e0b',
              600: '#d97706',
            },
            danger: {
              500: '#ef4444',
              600: '#dc2626',
            },
          },
          animation: {
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'shimmer': 'shimmer 2s linear infinite',
            'fade-in': 'fadeIn 0.3s ease-out',
            'slide-up': 'slideUp 0.4s ease-out',
          },
          keyframes: {
            shimmer: {
              '0%': { backgroundPosition: '-200% 0' },
              '100%': { backgroundPosition: '200% 0' },
            },
            fadeIn: {
              '0%': { opacity: '0', transform: 'translateY(8px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            slideUp: {
              '0%': { opacity: '0', transform: 'translateY(20px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
          },
        },
      },
    }
  </script>
  <style>
    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }

    /* Glass effect */
    .glass {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(148, 163, 184, 0.1);
    }

    .glass-strong {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(148, 163, 184, 0.15);
    }

    /* Glow effects */
    .glow-primary {
      box-shadow: 0 0 20px rgba(4, 115, 234, 0.3), 0 0 40px rgba(4, 115, 234, 0.1);
    }

    .glow-success {
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
    }

    .glow-warning {
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.3);
    }

    /* Grid pattern - only show in dark mode */
    .dark .bg-grid {
      background-image:
        linear-gradient(rgba(148, 163, 184, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(148, 163, 184, 0.03) 1px, transparent 1px);
      background-size: 24px 24px;
    }

    /* Light mode - no grid pattern */
    .bg-grid {
      background-image: none;
    }

    /* Line clamp */
    .line-clamp-1 {
      overflow: hidden;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 1;
    }

    /* Status indicator pulse */
    @keyframes statusPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .status-pulse {
      animation: statusPulse 2s ease-in-out infinite;
    }

    /* Hover lift effect */
    .hover-lift {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .hover-lift:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px -5px rgba(0, 0, 0, 0.3);
    }

    /* Focus ring */
    .focus-ring:focus-within {
      box-shadow: 0 0 0 2px rgba(4, 115, 234, 0.5);
    }
  </style>
</head>
<body class="bg-gray-50 dark:bg-slate-950 text-gray-900 dark:text-slate-200 font-sans antialiased bg-grid min-h-screen">
  <div id="root"></div>
  <script type="module" src="./main.tsx"></script>
</body>
</html>
