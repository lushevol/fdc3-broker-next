      // generate comments base on interface Comment also link some replies to parent comments

      function makeComment({
        id,
        text,
        user,
        parentID,
        createdAt,
        updatedAt,
        likes,
        likedByCurrentUser,
      }) {
        return {
          id,
          text,
          createdAt: createdAt || new Date(),
          updatedAt,
          user,
          parentID,
          likes,
          likedByCurrentUser,
        };
      }

      const users = [

          bankid: '1664072',
          name: 'Jane Doe',
          avatarUrl: 'https://randomuser.me/api/portraits/women/44.jpg',
        },

          avatarUrl: 'https://randomuser.me/api/portraits/men/32.jpg',

        {
          bankid: '1664072',
          name: 'Priya Patel',
          avatarUrl: 'https://randomuser.me/api/portraits/women/12.jpg',
        },
      ];

      let commentId = 1;
      function nextId() {
        return `c${commentId++}`;
      }

      let comments = [];
      for (let i = 0; i < 2; i++) {
        const parentId = nextId();
        const comment = makeComment({
          likes: i + 1,
          id: parentId,
          text: `Parent comment ${i + 1}`,
          user: users[i % users.length],
          createdAt: new Date(Date.now() - (i + 1) * 3600 * 1000),
        });

        // Add sample attachments to first comment
        if (i === 0) {
          comment.attachments = [
            {
              id: 'att-1',
              fileName: 'sample-document.pdf',
              fileSize: 1024 * 150, // 150 KB
              fileType: 'application/pdf',
              fileUrl: 'https://example.com/sample.pdf',
              uploadedBy: users[0].bankid,
              uploadedAt: new Date(),
              commentId: parentId,
            },
            {
              id: 'att-2',
              fileName: 'screenshot.png',
              fileSize: 1024 * 1024 * 2.5, // 2.5 MB
              fileType: 'image/png',
              fileUrl: 'https://via.placeholder.com/600x400.png?text=Preview',
              uploadedBy: users[0].bankid,
              uploadedAt: new Date(),

      const posterOptions = [

                    'most-replies': (a, b) => {
                      const countReplies = targetId =>
                        comments.reduce(
                          (count, c) =>
                            count + (c.parentID === targetId ? 1 : 0),
                          0
                        );
                      return countReplies(b.id) - countReplies(a.id);
                    },

              <div style="padding: 15px;">

                  .sorterComparators=${{

                      return countReplies(b.id) - countReplies(a.id);

                  .actions=${[
                    {

                  enable-edit

                    comments = e.detail.allComments;
                    console.log(12, comments);
                    const component = document.querySelector('sc-comment');

                  @sc-attachment-preview=${e => {

                  @sc-comment-file-upload=${e => {
                    console.log('File upload:', e.detail);
                  }}

                  @sc-comment-file-download=${e => {

                  @sc-comment-file-error=${e => {

                >
                </sc-comment>
