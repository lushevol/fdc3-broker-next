      sourceName: cert
      targetName: truststore.jks
      type: file
    - path: scb/55313/<%= componentId %>-<%= name.replace(/-exp-api$/, '') %>-plugin/app/kv/data/trust_store_stg
      sourceName: cert_key
      targetName: TRUSTSTORE_PASSWORD
      type: static
    - path: scb/55313/<%= componentId %>-<%= name.replace(/-exp-api$/, '') %>-plugin/app/kv/data/key_store_stg
      sourceName: cert
      targetName: keystore.jks
      type: file
