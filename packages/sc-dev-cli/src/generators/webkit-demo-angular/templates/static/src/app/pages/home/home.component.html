<div class="mx-3 mb-4">
    <h4>Good Morning, {{profile.name}}</h4>
</div>
<div class="flex space-x-4 mt-3 px-3 mb-4 overflow-y-auto no-scrollbar">
    <img *ngFor="let item of banners"
        [src]="item.image" 
        width="90%" 
        class="mb-2 rounded-lg" 
        alt="" 
    />
</div>
<div class="mx-2 mb-4">
    <div class="grid grid-cols-4 justify-center space-between mt-1 mb-4">
        <div *ngFor="let item of shortcuts">
            <div class="px-3">
                <sc-icon-card 
                    [image]="item.icon"
                    width="100%" 
                    height="60px" 
                    size="one-fourth" 
                    layout="title-out"
                    (click)="handleShowSideSheet(true)"
                >
                </sc-icon-card>
            </div>
            <div class="mt-1 px-1 text-center text-xs font-semibold line-clamp-3">{{item.title}}</div>
        </div>
    </div>
</div>
<div>
    <div class="border-bottom"></div>
    <div *ngFor="let item of accounts" class="mt-3 mb-3 mx-3">
        <sc-card 
            vertical-align="top" 
            [image]="item.icon" 
            icon="arrow-ios-downward"
        >
            <div slot="title" class="grid grid-cols-2 w-full">
                <div class="align-middle">
                    <span>
                        {{item.title}}
                    </span>
                </div>
                <div class="mr-2 align-top text-right justify-items-end justify-end">
                    <div>{{item.currency}} <span class="text-lg font-bold">{{item.amount}}</span></div>
                    <div class="text-sm text-muted font-normal" style="min-width:30vw">{{item.label}}</div>
                </div>
            </div>
        </sc-card>
    </div>
</div>
<sc-side-sheet [open]="showSideSheet" (onScHide)="handleShowSideSheet(false)">
    <app-not-available />
</sc-side-sheet>
