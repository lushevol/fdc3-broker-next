user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;

  log_format structured escape=json
    '{"time":"$time_iso8601","remote":"$remote_addr","request":"$request",'
    '"status":$status,"bytes":$body_bytes_sent,"duration":$request_time,'
    '"referer":"$http_referer","user_agent":"$http_user_agent"}';
  access_log /dev/stdout structured;
  error_log /dev/stderr warn;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65s;
  client_max_body_size 1m;

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

  include /etc/nginx/conf.d/*.conf;
}

