<!-- Custom script -->
<script type="text/javascript">
  var modes = ['light', 'dark', 'dyslexic']
  var activeMode = modes[0]
  function changeMode(mode) {
    var componentCells = document.querySelectorAll('.table .table-row > .table-cell:last-child');
    componentCells.forEach((componentCell) => {
      modes.forEach((mode) => {
        componentCell.classList.remove(`sc-mode-${mode}`)
      })
      componentCell.classList.add(`sc-mode-${mode}`)
      if (componentCell.classList.contains('inverse')) {
        if (mode === 'dark') {
          componentCell.style.backgroundColor = 'var(--sc-color-white)'
        } else {
          componentCell.style.backgroundColor = 'var(--sc-color-blue-900)'
        }
      }
    })
  }
  document.getElementsByTagName('sc-dropdown-input')[0].addEventListener('sc-select', ({ detail: { value } }) => {
    changeMode(value);
  });
  changeMode(activeMode);
</script>

<script type="module">
  import { CountryIconLibrary, MainIconLibrary } from '@scdevkit/icons';
  changeIconLibrary();
  function changeIconLibrary() {
    document.getElementsByTagName('sc-icon-provider')[0].iconLibraries = [MainIconLibrary, CountryIconLibrary];
  }
</script>
