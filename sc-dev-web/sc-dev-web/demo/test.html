<!doctype html>
<html lang="en-GB">

<head>
  <title>sc-web-kit demo page</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" type="text/css" href="/node_modules/@scdevkit/styles/dist/util.css" />
  <link rel="stylesheet" type="text/css" href="/dist/styles/ScDarkMode.css" />
  <link rel="stylesheet" type="text/css" href="/dist/styles/ScDyslexicMode.css" />

  <!-- Custom style -->
  <style>
    body {
      padding: 0;
      margin: 0;
    }

    .sc-mode-dark {
      background-color: var(--sc-color-grey-100)
    }
  </style>

  <!-- Register all sc-* custom elements -->
  <script type="module">
    import '../dist/elements/index.js';
    import { html } from '/node_modules/lit-html/lit-html.js';
    window.html = html;

  </script>

</head>

<body>
  <button class="change-mode">change-mode</button>
  <div style="height: 500px">
