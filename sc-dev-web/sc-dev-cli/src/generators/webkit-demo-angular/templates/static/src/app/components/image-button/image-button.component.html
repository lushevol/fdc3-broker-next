<div
  class="flex flex-row rounded-full py-1 bg-white whitespace-nowrap"
  [ngClass]="{
    'px-2': compact,
    'px-3': !compact,
    highlight: highlight
  }"
>
  <div *ngIf="image" class="mr-2 text-left" [style.width.px]="size()">
    <img [src]="image" [width]="size()" alt="" />
  </div>
  <div class="text-center m-auto">
    <span class="font-semibold">{{ title }}</span>
  </div>
</div>
