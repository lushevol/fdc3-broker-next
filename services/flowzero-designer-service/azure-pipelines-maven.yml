trigger: none

parameters:
  - name: releaseId
    type: string
    displayName: Release Item Id
    default: 0

  - name: rollbackAppVersion
    type: string
    displayName: Rollback App Version
    default: 0

  - name: rollbackBuildNumber
    type: string
    displayName: Rollback Build Number
    default: 0

  - name: deployEnv
    type: string
    displayName: Deploy to VM or AWS (only for develop branch)
    default: vm
    values:
      - vm
      - eks
      - sit
      - demo

  - name: runDevStage
    type: boolean
    displayName: Auto deploy DEV
    default: true
    values:
      - false
      - true

variables:
  - name: APP_NAME
    value: ${{ replace(variables['Build.Repository.Name'], '51358-', '') }}

resources:
  repositories:
    - repository: templates
      ref: feature/flowzero
      name: FMQPR/51358-ratanone-ado-templates
      type: git

extends:
  template: java-maven.yml@templates
  parameters:
    releaseId: ${{ parameters.releaseId }}
    jdkVersion: 17
    packageVersion: 1.0.2
    deployStack: ansible
    rollbackAppVersion: ${{ parameters.rollbackAppVersion }}
    rollbackBuildNumber: ${{ parameters.rollbackBuildNumber }}
    deployEnv: ${{ parameters.deployEnv }}
    featureRelease: true
    runDevStage: ${{ parameters.runDevStage }}
    sonarCoverageExclusions: 'com/scb/ratan/flowzero/designer/converter/**,com/scb/ratan/flowzero/designer/common/**,com/scb/ratan/flowzero/designer/annotation/**,com/scb/ratan/flowzero/designer/config/**,com/scb/ratan/flowzero/designer/entity/**,com/scb/ratan/flowzero/designer/feign/**,com/scb/ratan/flowzero/designer/processor/**,com/scb/ratan/flowzero/designer/repository/**,com/scb/ratan/flowzero/designer/controller/**,com/scb/ratan/flowzero/designer/service/**,**/RatanFlowzeroDesignerApplication*'

