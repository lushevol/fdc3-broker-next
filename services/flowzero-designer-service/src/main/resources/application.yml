PGSL_RDB_SCHEMA: ratan_flowzero_designer_service

info:
  build:
    artifactId: "@project.artifactId@"
    name: "@project.name@"
    description: "@project.description@"
    version: "@project.version@"
  applicationName: ${spring.application.name}

spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        primary-dialect: org.hibernate.dialect.PostgreSQLDialect
  application:
    name: ratan-flowzero-designer-service
  datasource:
    url: ${PGSL_RDB_URL}
    username: ${PGSL_RDB_USERNAME_HASHICORP}
    password: ${PGSL_RDB_JANUS_HASHICORP}
    driver-class-name: ${PGSL_RDB_DRIVER}

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    placeholder-replacement: false
    table: ratanone_flowzero_schema_history
  retry:
    enabled: true

retry:
  max-attempts: 3
  backoff:
    delay: 2000
    multiplier: 2.0
    max-delay: 5000

  upload:
    max-attempts: 3
    backoff:
      delay: 5000
      multiplier: 2.0
      max-delay: 8000

  download:
    max-attempts: 3
    backoff:
      delay: 5000
      multiplier: 2.0
      max-delay: 5000

jasypt:
  encryptor:
    password: ${RATAN_CIPHER_KEY}

# -----------------------------------------------------------------------
# minio / nas — defined per environment profile
#   application-dev.yml      (local development)
#   application-uat1.yml     (UAT1)
#   application-staging.yml  (Staging)
#   application-prod.yml     (Production)
#
# Activate via: -Dspring.profiles.active=uat1
# -----------------------------------------------------------------------


