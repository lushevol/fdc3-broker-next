# Local development configuration with mocked dependencies
spring:
  application:
    name: single-ui-bff-local

  # Use H2 in-memory database for local development
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;INIT=CREATE SCHEMA IF NOT EXISTS POST_TRADE_PORTAL_SERVICE\;SET SCHEMA POST_TRADE_PORTAL_SERVICE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  # Disable LDAP auto-configuration for local
  ldap:
    urls: ldap://localhost:389
  # Disable Flyway for local (use JPA ddl-auto instead)
  flyway:
    enabled: false

# Local server config
server:
  port: 8088

# Disable Eureka client for local
eureka:
  client:
    enabled: false

# Disable jasypt encryption warning
jasypt:
  encryptor:
    password: local-dev-key

