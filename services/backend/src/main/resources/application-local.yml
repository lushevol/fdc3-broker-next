# Auth Configuration (mocked for local)
auth:
  oud:
    un: testuser
    pw: testpassword
    id: testid
  elastic:
    host: http://localhost:9200
    key: mock-key
    value: mock-value
    connectTimeout: 10000
    readTimeout: 30000
  whitelisted:
    idList:
      - 2001208
    envList:
      - localhost
      - 127.0.0.1
    attrList:
      - uid
      - cn
      - mail

# FMAA Configuration (mocked for local)
scb:
  fmaa:
    host: http://localhost:8088
    verificationPath: http://localhost:8088/introspect?app_id=FMO_PORTAL&access_token=%s
    connectTimeout: 10000
    readTimeout: 30000
    creationEnabled: false
  ems2:
    connectTimeout: 5000
    readTimeout: 5000
    host: http://localhost:8088
    userRoles: http://localhost:8088/ems2/rest/account/%s
    newUserAuthorizationOnEntity: http://localhost:8088/ems2/rest/entitlements/entitlementList
    adminModuleEntity: FMO PORTAL ADMIN
  mfa:
    headers:
      X-Cert: mock-cert
    accessToken: /access_token
    connectTimeout: 10
    readTimeout: 30
    redirectUri: http://localhost:8088/callback
    grantType: authorization_code

# Ratanone Configuration (disabled for local)
ratanone:
  security:
    auth-service: lb://SINGLE-UI-BFF
    token-header-name: x-token
  open-apis:
    auto-startup: false
    api-gateway-url: http://localhost:8088
    api-gateway-token: mock-token
    apis: []

# Actuator endpoints exposed
management:
  endpoints:
    web:
      exposure:
        include: health,info

# Logging
logging:
  level:
    root: INFO
    com.scb.sso.singleuibff: DEBUG
    org.springframework: INFO
    org.hibernate: WARN
