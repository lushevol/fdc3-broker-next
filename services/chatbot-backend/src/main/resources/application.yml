spring:
  application:
    name: chatbot-backend
  autoconfigure:
    exclude:
      - org.springframework.ai.retry.autoconfigure.SpringAiRetryAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
  ai:
    openai:
      api-key: ${CHATBOT_OPENAI_API_KEY:}
      base-url: ${CHATBOT_OPENAI_BASE_URL:https://coding.dashscope.aliyuncs.com/v1}
      chat:
        model: ${CHATBOT_OPENAI_MODEL:qwen3.5-plus}
        temperature: ${CHATBOT_OPENAI_TEMPERATURE:0.7}
    anthropic:
      api-key: ${CHATBOT_ANTHROPIC_API_KEY:}
      model: ${CHATBOT_ANTHROPIC_MODEL:claude-3-sonnet-20240229}

server:
  port: 8080

chatbot:
  mock:
    enabled: false
  agent:
    name: FDC3 Assistant
    max-tokens: 4096
    conversation-timeout: 1800000 # 30 minutes
  security:
    enabled: ${CHATBOT_SECURITY_ENABLED:true}
    allowed-origins: ${CHATBOT_SECURITY_ALLOWED_ORIGINS:http://localhost:8001,http://127.0.0.1:8001}
    fallback-profiles: ${CHATBOT_SECURITY_FALLBACK_PROFILES:default}
    additional-profiles: ${CHATBOT_SECURITY_ADDITIONAL_PROFILES:}
  protocol:
    sse-timeout-millis: ${CHATBOT_PROTOCOL_SSE_TIMEOUT_MILLIS:300000}
  tools:
    enabled: true
  mcp:
    registration-max-attempts: ${CHATBOT_MCP_REGISTRATION_MAX_ATTEMPTS:10}
    registration-retry-delay-millis: ${CHATBOT_MCP_REGISTRATION_RETRY_DELAY_MILLIS:1000}
    providers:
      - enabled: ${CHATBOT_MCP_ELASTICSEARCH_ENABLED:false}
        provider-id: elasticsearch-analytics
        service-name: Elasticsearch Analytics MCP
        transport-type: STREAMABLE_HTTP
        url: ${CHATBOT_MCP_ELASTICSEARCH_URL:}
        enabled-profiles:
          - advisor
        description: Read-only analytics MCP provider used for app usage statistics.
      - enabled: ${CHATBOT_MCP_RAG_ENABLED:false}
        provider-id: rag-knowledge-base
        service-name: RAG Knowledge Base MCP
        transport-type: STREAMABLE_HTTP
        url: ${CHATBOT_MCP_RAG_URL:}
        enabled-profiles:
          - advisor
        description: Read-only RAG retrieval MCP provider used for knowledge base search.
  agent-utils:
    web-search:
      api-key: ${CHATBOT_BRAVE_SEARCH_API_KEY:}
      result-count: 5
    skills:
      enabled: true
    bash:
      enabled: true
      timeout-seconds: 60
      max-output-chars: 50000
  memory:
    enabled: ${CHATBOT_MEMORY_ENABLED:true}
    directory: ${CHATBOT_MEMORY_DIRECTORY:./data/memories}
  rate-limit:
    requests-per-minute: 60
    tokens-per-minute: 100000

logging:
  level:
    com.fdc3.chatbot: DEBUG
    org.springframework.ai.openai: DEBUG
