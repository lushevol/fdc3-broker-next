spring:
  application:
    name: chatbot-backend
  ai:
    openai:
      api-key: ${MY_OPENAI_API_KEY:}
      base-url: ${MY_OPENAI_BASE_URL:}
      model: ${MY_OPENAI_MODEL:gpt-4}
      temperature: ${MY_OPENAI_TEMPERATURE:0.7}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${ANTHROPIC_MODEL:claude-3-sonnet-20240229}

server:
  port: 8080

chatbot:
  mock:
    enabled: true
  agent:
    name: FDC3 Assistant
    max-tokens: 4096
    conversation-timeout: 1800000 # 30 minutes
  tools:
    enabled: true
  rate-limit:
    requests-per-minute: 60
    tokens-per-minute: 100000

logging:
  level:
    com.fdc3.chatbot: DEBUG
    dev.langchain4j: INFO
