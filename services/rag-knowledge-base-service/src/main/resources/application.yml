server:
  port: 8091

spring:
  application:
    name: rag-knowledge-base-service
  ai:
    mcp:
      server:
        name: rag-knowledge-base-service
        version: 0.0.1
        type: SYNC
        protocol: STREAMABLE
        instructions: 'Provides read-only retrieval over local knowledge base documents'
        capabilities:
          tool: true
          resource: false
        streamable-http:
          mcp-endpoint: /api/mcp

management:
  endpoints:
    web:
      exposure:
        include: health,info

rag:
  ingestion:
    enabled: ${RAG_INGESTION_ENABLED:true}
    resource-pattern: ${RAG_KNOWLEDGE_RESOURCE_PATTERN:classpath:/knowledge/*.md}
  chunking:
    max-chars: ${RAG_CHUNK_MAX_CHARS:1200}
    overlap-chars: ${RAG_CHUNK_OVERLAP_CHARS:160}
  embedding:
    provider: ${RAG_EMBEDDING_PROVIDER:openrouter}
    openrouter:
      api-key: ${OPENROUTER_API_KEY:}
      base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
      model: ${OPENROUTER_EMBEDDING_MODEL:openai/text-embedding-3-small}
      timeout-millis: ${OPENROUTER_EMBEDDING_TIMEOUT_MILLIS:30000}
    copilot-api:
      base-url: ${RAG_EMBEDDING_COPILOT_API_BASE_URL:http://localhost:4141}
      api-key: ${RAG_EMBEDDING_COPILOT_API_KEY:}
      model: ${RAG_EMBEDDING_COPILOT_API_EMBEDDING_MODEL:text-embedding-3-small}
      timeout-millis: ${RAG_EMBEDDING_COPILOT_API_TIMEOUT_MILLIS:30000}
  elasticsearch:
    enabled: ${RAG_ELASTICSEARCH_ENABLED:false}
    uris: ${RAG_ES_URIS:http://localhost:9200}
    username: ${RAG_ES_USERNAME:}
    password: ${RAG_ES_PASSWORD:}
    index-name: ${RAG_ES_INDEX_NAME:rag-knowledge-chunks}
    embedding-dimension: ${RAG_ES_EMBEDDING_DIMENSION:1536}
  search:
    default-top-k: ${RAG_SEARCH_DEFAULT_TOP_K:5}
    max-top-k: ${RAG_SEARCH_MAX_TOP_K:10}
    embedding-timeout-millis: ${RAG_SEARCH_EMBEDDING_TIMEOUT_MILLIS:30000}
  executor:
    core-pool-size: ${RAG_EMBEDDING_EXECUTOR_CORE_POOL_SIZE:2}
    max-pool-size: ${RAG_EMBEDDING_EXECUTOR_MAX_POOL_SIZE:4}
    queue-capacity: ${RAG_EMBEDDING_EXECUTOR_QUEUE_CAPACITY:32}

logging:
  level:
    root: INFO
    com.fdc3.rag: DEBUG
