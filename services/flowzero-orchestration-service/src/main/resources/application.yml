# ── Resilience4j: iCDMS 三重防护 (RateLimiter → CircuitBreaker → TimeLimiter) ──────
resilience4j:

  # ① 限流：令牌桶算法，每秒最多 10 次请求
  ratelimiter:
    instances:
      icdmsClient:
        limitForPeriod: 10          # 刷新周期内最大许可数
        limitRefreshPeriod: 1s      # 许可刷新周期
        timeoutDuration: 0ms        # 获取许可等待时间；0=立即失败（快速失败）

  # ② 断路器：COUNT_BASED 滑动窗口
  circuitbreaker:
    instances:
      icdmsClient:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20               # 统计最近 20 次请求
        failureRateThreshold: 50            # 失败率 ≥50% → OPEN
        slowCallRateThreshold: 80           # 慢调用率 ≥80% → OPEN
        slowCallDurationThreshold: 5s       # 超过 5s 算慢调用（与 TimeLimiter 8s 协同）
        permittedNumberOfCallsInHalfOpenState: 5
        waitDurationInOpenState: 60s        # OPEN 后冷却 60s 再试探
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordExceptions:
          - org.springframework.web.client.ResourceAccessException
          - com.scb.ratan.flowzero.workflow.common.exception.IcdmsSyncException
          - java.util.concurrent.TimeoutException
        ignoreExceptions:
          - com.scb.ratan.flowzero.workflow.common.exception.IcdmsClientException  # 4xx 不计入失败率

  # ③ 超时限制：防止线程长时间阻塞
  timelimiter:
    instances:
      icdmsClient:
        timeoutDuration: 8s         # 单次 HTTP 调用最长 8s
        cancelRunningFuture: true   # 超时后中断底层线程

  open-apis:
    auto-startup: true
    api-gateway-url: ${API_GATEWAY_URL}
    api-gateway-token: ${API_GATEWAY_TOKEN}
