scb:
  fmaa:
    host: ${FMAA_HOST}
    verificationPath: ${scb.fmaa.host}/introspect?app_id=FMO_PORTAL&access_token=%s
    connectTimeout: 5000 #ms
    readTimeout: 5000 #ms
    creationEnabled: false
  ems2:
    cachingEnabled: true
    newApiEnabled: false
    expiryTime: 60 #seconds
    host: ${EMS2_HTTPS_HOST}
    userRoles: ${scb.ems2.host}/ems2/rest/account/%s
    newUserAuthorizationOnEntity: ${scb.ems2.host}/ems2/rest/entitlements/entitlementList
    adminModuleEntity: FMO PORTAL ADMIN
  mfa:
    headers:
      X-Cert: ${MFA_CERT}
    accessToken: /access_token
    connectTimeout: 10 #seconds
    readTimeout: 30 #seconds
    redirectUri: ${MFA_REDIRECT_URI}
    grantType: authorization_code
  entra:
    tenant_id: b44900f1-2def-4c3b-9ec6-9020d604e19e
    client_id: fd99d1e8-e543-4345-b5f0-208c94ffd39a
    scope: openid
    client_assertion_type: urn:ietf:params:oauth:client-assertion-type:jwt-bearer
    grant_type: authorization_code
    redirect_uri: https://fmo-mfe.gdc.standardchartered.com:8453/mfa/callback
    entra_token_endpoint: https://login.microsoftonline.com/${scb.entra.tenant_id}/oauth2/v2.0/token
    client_cert_path: file:/apps/ratanrt/ssl/pk12/ssl_certificate_prod.crt
    client_key_path: file:/apps/ratanrt/ssl/pk12/ssl_certificate_prod.key
    connectTimeout: 10 #seconds
    readTimeout: 30 #seconds
    proxyHost: gateway.zscloud.net
    proxyPort: 443

ratanone:
  security:
    auth-service: lb://SINGLE-UI-BFF-EMS3
    token-header-name: x-token
  open-apis:
    auto-startup: true
    api-gateway-url: ${API_GATEWAY_URL}
    api-gateway-token: ${API_GATEWAY_TOKEN}
    apis:
      - name: single-ui-bff-ems3@extend
        skipApiDefinitionValidation: true
        entrypoint:
          method: POST
          path: /v2/sso/extend
        endpoint:
          service: lb://SINGLE-UI-BFF-EMS3
          path: /v2/sso/extend
        auth:
          required: false
        audit:
          type: Access
          action: Extend
      - name: single-ui-bff-ems3@refreshtoken
        skipApiDefinitionValidation: true
        entrypoint:
          method: POST
          path: /v2/sso/refreshtoken
        endpoint:
          service: lb://SINGLE-UI-BFF-EMS3
          path: /v2/sso/refreshtoken
        auth:
          required: false
        audit:
          type: Access
          action: RefreshToken
      - name: single-ui-bff-ems3@v2login
        skipApiDefinitionValidation: true
        entrypoint:
          method: POST
          path: /v2/sso/login
        endpoint:
          service: lb://SINGLE-UI-BFF-EMS3
          path: /v2/sso/login
        auth:
          required: false
        audit:
          type: Access
          action: V2Login
      - name: single-ui-bff-ems3@v3login
        skipApiDefinitionValidation: true
        entrypoint:
          method: POST
          path: /v3/sso/login
        endpoint:
          service: lb://SINGLE-UI-BFF-EMS3
          path: /v3/sso/login
        auth:
          required: false
        audit:
          type: Access
          action: V3Login
      - name: single-ui-bff-ems3@v2relogin
        skipApiDefinitionValidation: true
        entrypoint:
          method: POST
          path: /v2/sso/relogin
        endpoint:
          service: lb://SINGLE-UI-BFF-EMS3
          path: /v2/sso/relogin
        auth:
          required: false
        audit:
          type: Access
          action: V2Relogin
      - name: single-ui-bff-ems3@v2validate
        skipApiDefinitionValidation: true
        entrypoint:
          method: POST
          path: /v2/sso/validate
        endpoint:
          service: lb://SINGLE-UI-BFF-EMS3
          path: /v2/sso/validate
        auth:
          required: false
        audit:
          type: Access
          action: V2Validate
      - name: single-ui-bff-ems3@v2logout
        skipApiDefinitionValidation: true
        entrypoint:
          method: POST
          path: /v2/sso/logout
        endpoint:
          service: lb://SINGLE-UI-BFF-EMS3
          path: /v2/sso/logout
        auth:
          required: false
        audit:
          type: Access
          action: V2Logout
      - name: single-ui-bff-ems3@v1AnalyticsPrint
        skipApiDefinitionValidation: true
        entrypoint:
          method: POST
          path: /v1/fmo/print
        endpoint:
          service: lb://SINGLE-UI-BFF-EMS3
          path: /v1/fmo/print
        auth:
          required: false
        audit:
          type: Access
          action: V1AnalyticsPrint
      - name: single-ui-bff-ems3@v1Analytics
        skipApiDefinitionValidation: true
        entrypoint:
          method: POST
          path: /v1/fmo/analytics
        endpoint:
          service: lb://SINGLE-UI-BFF-EMS3
          path: /v1/fmo/analytics
        auth:
          required: false
        audit:
          type: Access
          action: V1Analytics
      - name: single-ui-bff-ems3@v1ImportMapActive
        skipApiDefinitionValidation: true
        entrypoint:
          method: GET
          path: /v1/fmo/admin/importmap/active
        endpoint:
          service: lb://SINGLE-UI-BFF-EMS3
          path: /v1/fmo/admin/importmap/active
        auth:
          required: false
        audit:
          type: Access
          action: V1ImportMapActive
      - name: single-ui-bff-ems3@v1ConfigUpload
