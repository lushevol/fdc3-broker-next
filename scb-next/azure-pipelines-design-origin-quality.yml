trigger: none

pr:
  paths:
    include:
      - scb-next/azure-pipelines-design-origin-quality.yml
      - package.json
      - package-lock.json
      - sc-dev-web/**
      - scb-next/docs/UI_PACKAGE_*.md
      - scb-next/package.json
      - scb-next/package-lock.json
      - scb-next/packages/ratan-design-origin/**
      - scb-next/scripts/run-design-origin-browser.mjs
      - scb-next/scripts/run-base-ui-parity.mjs
      - scb-next/scripts/run-base-ui-parity.test.mjs
      - scb-next/scripts/prepare-design-origin-release.mjs
      - scb-next/scripts/prepare-design-origin-release.test.mjs
      - scb-next/scripts/prepare-webkit-host.mjs
      - scb-next/scripts/prepare-webkit-host.test.mjs
      - scb-next/scripts/verify-dependency-isolation.mjs
      - scb-next/scripts/verify-dependency-isolation.test.mjs
      - scb-next/scripts/verify-design-origin-quality.mjs
      - scb-next/scripts/verify-design-origin-quality.test.mjs
      - scb-next/scripts/verify-base-design-imports.mjs
      - scb-next/tests/e2e/design-origin*.spec.ts
      - scb-next/tests/e2e/base-ui-*.spec.ts
      - scb-next/tests/e2e/browser-*.ts
      - scb-next/tests/e2e/storybook-helpers.ts
      - scb-next/tests/e2e/__screenshots__/**
      - scb-next/docs/BASE_UI_*.md
      - scb-next/web/mfe-base-origin/**
      - scb-next/web/mfe-ratan-container-origin/**
      - scb-next/web/mfe-cashflow-blotter-origin/**

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    fetchDepth: 0

  - task: NodeTool@0
    displayName: Use Node.js 24
    inputs:
      versionSpec: 24.x

  - script: npm ci
    displayName: Install scb-next dependencies
    workingDirectory: scb-next

  - script: npm ci --workspace @scdevkit/webkit --workspace @scdevkit/webkit-rte --ignore-scripts
    displayName: Install locked canonical WebKit dependencies

  - script: npx playwright install --with-deps chromium
    displayName: Install Chromium
    workingDirectory: scb-next

  - script: npm run verify:design-origin
    displayName: Verify ratan-design-origin candidate
    workingDirectory: scb-next
