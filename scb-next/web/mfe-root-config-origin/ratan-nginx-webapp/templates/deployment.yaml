apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ template "ratan-nginx-webapp.name" . }}
    app_name: {{ .Release.Name }}
    app_version: {{ .Values.appVersion }}
    chart: {{ template "ratan-nginx-webapp.chart" . }}
    chart_version: {{ .Chart.Version }}
    component: ratan-nginx-webapp
    environment: {{ .Values.environment }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ template "ratan-nginx-webapp.name" . }}
      app_name: {{ .Release.Name }}
      chart: {{ template "ratan-nginx-webapp.chart" . }}
      component: ratan-nginx-webapp
      environment: {{ .Values.environment }}
  template:
    metadata:
      labels:
        app: {{ template "ratan-nginx-webapp.name" . }}
        app_name: {{ .Release.Name }}
        app_version: {{ .Values.appVersion }}
        chart: {{ template "ratan-nginx-webapp.chart" . }}
        chart_version: {{ .Chart.Version }}
        component: ratan-nginx-webapp
        environment: {{ .Values.environment }}
    spec:
      terminationGracePeriodSeconds: 30
      serviceAccountName: "{{ .Release.Name }}-account"
      nodeSelector:
        eks.amazonaws.com/nodegroup: "ratan_apps"
      containers:
        - name: {{ .Release.Name }}
          image: artifactory.global.standardchartered.com/ratan/{{ .Release.Name }}:{{ .Values.appVersion }}
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: RATAN_ENV
              value: "{{ .Values.environment }}"
            - name: APPLICATION_NAME
              value: "{{ .Release.Name }}"
            - name: CONSUL_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: CONSUL_PORT
              value: "8500"
            - name: CONSUL_ADDRESS
              value: "http://$(CONSUL_HOST):$(CONSUL_PORT)"
            - name: CONSUL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ratan-consul-application-token
                  key: application_token
          ports:
            - containerPort: 8080
              name: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /index.js
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /index.js
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1
