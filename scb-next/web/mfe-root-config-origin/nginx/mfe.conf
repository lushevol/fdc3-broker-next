server {
    listen             8453 ssl http2;
    server_name        fmo-mfe-dev.uk.dev.net;
    include config-ratan/ratan_ssl.conf;
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy "same-origin";
    add_header X-Content-Type-Options nosniff;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self' https: http:; font-src 'self' data: https: http:; script-src blob: 'unsafe-eval' 'unsafe-inline' http: https: mo-mfe-dev.uk.dev.net:8453 fmo-mfe.uk.dev.net:8453 fmo-mfe-preprod.pi.dev.net:8453  fmo-mfe.gdc.standardchartered.com:8453; img-src 'self' data: https: http:; connect-src 'self' data: https: http: wss: ws://localhost:*; style-src 'self' 'unsafe-inline' 'unsafe-eval' https: http:; object-src 'none'";
    add_header Permissions-Policy "fullscreen=(self 'https://fmo-mfe-dev.uk.dev.net:8453'), geolocation=*, notifications=(), push=(), sync-xhr=()";
    
    #fix 150263 Insecure Transport issue
    error_page 497 301 =307 https://$host:$server_port$request_uri;

    # mfe base container
    location /base/ {
        rewrite ^/base/(.*)$ /$1 break;
        proxy_redirect    off;
        proxy_set_header  Host $host;
        proxy_set_header  X-Real-IP $remote_addr;
        proxy_set_header  X-Forwarded-Proto http;
        proxy_set_header  X-Forwarded-For $remote_addr;
        proxy_set_header  X-Forwarded-Host $remote_addr;
        proxy_pass http://base;
    }
