server {

   listen             8080;

   # mfe base container
   location /base/ {
      rewrite ^/base/(.*)$ /$1 break;
      proxy_redirect    off;
      proxy_set_header  Host $host;
      proxy_set_header  X-Real-IP $remote_addr;
      proxy_set_header  X-Forwarded-Proto http;
      proxy_set_header  X-Forwarded-For $remote_addr;
      proxy_set_header  X-Forwarded-Host $remote_addr;
      proxy_pass http://base;
   }

   # mfe template container
   location /template_container/ {
      rewrite ^/template_container/(.*)$ /$1 break;
      proxy_redirect    off;
      proxy_set_header  Host $host;
      proxy_set_header  X-Real-IP $remote_addr;
      proxy_set_header  X-Forwarded-Proto http;
      proxy_set_header  X-Forwarded-For $remote_addr;
      proxy_set_header  X-Forwarded-Host $remote_addr;
      proxy_pass http://template_container;
   }

   # mfe template application
   location /template/ {
      rewrite ^/template/(.*)$ /$1 break;
      proxy_redirect    off;
      proxy_set_header  Host $host;
      proxy_set_header  X-Real-IP $remote_addr;
      proxy_set_header  X-Forwarded-Proto http;
      proxy_set_header  X-Forwarded-For $remote_addr;
      proxy_set_header  X-Forwarded-Host $remote_addr;
      proxy_pass http://template;
   }

   # mfe RATAN container
   location /ratan_container/ {
      rewrite ^/ratan_container/(.*)$ /$1 break;
      proxy_redirect    off;
      proxy_set_header  Host $host;
      proxy_set_header  X-Real-IP $remote_addr;
      proxy_set_header  X-Forwarded-Proto http;
      proxy_set_header  X-Forwarded-For $remote_addr;
      proxy_set_header  X-Forwarded-Host $remote_addr;
      proxy_pass http://ratan_container;
   }

   # mfe RATAN/Trade application
   location /ratan_trade/ {
      rewrite ^/ratan_trade/(.*)$ /$1 break;
      proxy_redirect    off;
      proxy_set_header  Host $host;
      proxy_set_header  X-Real-IP $remote_addr;
      proxy_set_header  X-Forwarded-Proto http;
      proxy_set_header  X-Forwarded-For $remote_addr;
      proxy_set_header  X-Forwarded-Host $remote_addr;
      proxy_pass http://ratan_trade;
   }

   # mfe RATAN/Cashflow application BAU & CN
   location /ratan_cashflow/ {
      rewrite ^/ratan_cashflow/(.*)$ /$1 break;
      proxy_redirect    off;
      proxy_set_header  Host $host;
      proxy_set_header  X-Real-IP $remote_addr;
      proxy_set_header  X-Forwarded-Proto http;
      proxy_set_header  X-Forwarded-For $remote_addr;
      proxy_set_header  X-Forwarded-Host $remote_addr;
      proxy_pass http://ratan_cashflow;
   }

   # mfe RATAN/Cashflow application BAU
   location /ratan_cashflow_blotter/ {
       rewrite ^/ratan_cashflow_blotter/(.*)$ /$1 break;
       proxy_redirect    off;
       proxy_set_header  Host $host;
       proxy_set_header  X-Real-IP $remote_addr;
       proxy_set_header  X-Forwarded-Proto http;
       proxy_set_header  X-Forwarded-For $remote_addr;
       proxy_set_header  X-Forwarded-Host $remote_addr;
       proxy_pass http://ratan_cashflow_blotter;
   }

   # mfe RATAN/Exception application
   location /ratan_exception/ {
      rewrite ^/ratan_exception/(.*)$ /$1 break;
      proxy_redirect    off;
      proxy_set_header  Host $host;
      proxy_set_header  X-Real-IP $remote_addr;
      proxy_set_header  X-Forwarded-Proto http;
      proxy_set_header  X-Forwarded-For $remote_addr;
      proxy_set_header  X-Forwarded-Host $remote_addr;
      proxy_pass http://ratan_exception;
   }

   # mfe RATAN/Rules application
   location /ratan_rules/ {
      rewrite ^/ratan_rules/(.*)$ /$1 break;
      proxy_redirect   off;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto http;
      proxy_set_header X-forwarded-For $remote_addr;
      proxy_set_header X-forwarded-Host $remote_addr;
      proxy_pass http://ratan_rules;
   }

   # mfe RATAN/Authorization limits application
   location /ratan_authorization_limits/ {
      rewrite ^/ratan_authorization_limits/(.*)$ /$1 break;
      proxy_redirect    off;
      proxy_set_header  Host $host;
      proxy_set_header  X-Real-IP $remote_addr;
      proxy_set_header  X-Forwarded-Proto http;
      proxy_set_header  X-Forwarded-For $remote_addr;
      proxy_set_header  X-Forwarded-Host $remote_addr;
      proxy_pass http://ratan_authorization_limits;
   }

    # mfe RATAN/Nostro_Static for BAU @Judy
    location /ratan_nostro_static/ {
        rewrite ^/ratan_nostro_static/(.*)$ /$1 break;
        proxy_redirect    off;
        proxy_set_header  Host $host;
        proxy_set_header  X-Real-IP $remote_addr;
        proxy_set_header  X-Forwarded-Proto http;
        proxy_set_header  X-Forwarded-For $remote_addr;
        proxy_set_header  X-Forwarded-Host $remote_addr;
        proxy_pass http://ratan_nostro_static;
    }
    
   # mfe health for EKS
   location /health {
      proxy_redirect    off;
      proxy_set_header  Host $host;
      proxy_set_header  X-Real-IP $remote_addr;
      proxy_set_header  X-Forwarded-Proto http;
      proxy_set_header  X-Forwarded-For $remote_addr;
      proxy_set_header  X-Forwarded-Host $remote_addr;
      proxy_pass http://base/health;
   }

   # mfe CDUPS application
   location /cdups_container/ {
       rewrite ^/cdups_container/(.*)$ /$1 break;
       proxy_redirect    off;
       proxy_set_header  Host cdups-mfe-container-cdups-dev.apps.cdups-np.ocp.dev.net;
       proxy_set_header  X-Real-IP $remote_addr;
       proxy_set_header  X-Forwarded-Proto http;
       proxy_set_header  X-Forwarded-For $remote_addr;
       proxy_set_header  X-Forwarded-Host $remote_addr;
       add_header Access-Control-Allow-Origin *;
       add_header Cache-Control "public, no-cache";
       proxy_hide_header X-Powered-By;
       proxy_pass https://cdups_container;
   }
   # mfe CDUPS application
   location /cdups_tiles/ {
       rewrite ^/cdups_tiles/(.*)$ /$1 break;
       proxy_redirect    off;
       proxy_set_header  Host cdups-mfe-tiles-cdups-dev.apps.cdups-np.ocp.dev.net;
       proxy_set_header  X-Real-IP $remote_addr;
       proxy_set_header  X-Forwarded-Proto http;
       proxy_set_header  X-Forwarded-For $remote_addr;
       proxy_set_header  X-Forwarded-Host $remote_addr;
       add_header Access-Control-Allow-Origin *;
       add_header Cache-Control "public, no-cache";
       proxy_hide_header X-Powered-By;
       proxy_pass https://cdups_tiles;
   }
   # mfe CDUPS backend Service
   location /api/cdups/ {
       rewrite ^/api/cdups/(.*)$ /$1 break;
       proxy_redirect    off;
       proxy_set_header  Host cdups-document-service-cdups-uat.apps.cdups-np.ocp.dev.net;
       proxy_set_header  X-Real-IP $remote_addr;
       proxy_set_header  X-Forwarded-Proto http;
       proxy_set_header  X-Forwarded-For $remote_addr;
       proxy_set_header  X-Forwarded-Host $remote_addr;
       proxy_pass https://cdups_backend;
   }
   # mfe ssi_container application
   location /ssi_container/ {
       rewrite ^/ssi_container/(.*)$ /ssiplus-container/$1 break;
       proxy_redirect    off;
       proxy_set_header  Host $host;
       proxy_set_header  X-Real-IP $remote_addr;
       proxy_set_header  X-Forwarded-Proto http;
       proxy_set_header  X-Forwarded-For $remote_addr;
       proxy_set_header  X-Forwarded-Host $remote_addr;
       add_header Access-Control-Allow-Origin *;
       add_header Cache-Control "public, no-cache";
       proxy_pass http://ssi;
   }
   # mfe ssi_tiles application
   location /ssi_tiles/ {
       rewrite ^/ssi_tiles/(.*)$ /ssiplus-tiles/$1 break;
       proxy_redirect    off;
       proxy_set_header  Host $host;
       proxy_set_header  X-Real-IP $remote_addr;
       proxy_set_header  X-Forwarded-Proto http;
       proxy_set_header  X-Forwarded-For $remote_addr;
       proxy_set_header  X-Forwarded-Host $remote_addr;
       add_header Access-Control-Allow-Origin *;
       add_header Cache-Control "public, no-cache";
       proxy_pass http://ssi;
   }
   # mfe ssi_backend application
   location /api/ssiplus/ {
       rewrite ^/api/(.*)$ /$1 break;
       proxy_redirect    off;
       proxy_set_header  Host $host;
       proxy_set_header  X-Real-IP $remote_addr;
       proxy_set_header  X-Forwarded-Proto http;
       proxy_set_header  X-Forwarded-For $remote_addr;
       proxy_set_header  X-Forwarded-Host $remote_addr;
       proxy_http_version 1.1;                                                                                                                                            
       proxy_set_header Upgrade $http_upgrade;                                                                                                                            
       proxy_set_header Connection "upgrade";
       proxy_pass http://ssi_backend;
   }

   # mfe fss_container application
   location /mfe_fssservices_container/ {
       rewrite ^/mfe_fssservices_container/(.*)$ /fssservices-paymentProcess-container/$1 break;
       proxy_redirect    off;
       proxy_set_header  Host 10.198.52.181:8453;
       proxy_set_header  X-Real-IP $remote_addr;
       proxy_set_header  X-Forwarded-Proto http;
       proxy_set_header  X-Forwarded-For $remote_addr;
       proxy_set_header  X-Forwarded-Host $remote_addr;
       add_header Access-Control-Allow-Origin *;
       add_header Cache-Control "public, no-cache";
       proxy_pass https://fss;
   }
   # mfe fss_tiles application
   location /mfe_fssservices_tiles/ {
       rewrite ^/mfe_fssservices_tiles/(.*)$ /fssservices-paymentProcess-tiles/$1 break;
       proxy_redirect    off;
       proxy_set_header  Host 10.198.52.181:8453;
       proxy_set_header  X-Real-IP $remote_addr;
       proxy_set_header  X-Forwarded-Proto http;
       proxy_set_header  X-Forwarded-For $remote_addr;
       proxy_set_header  X-Forwarded-Host $remote_addr;
       add_header Access-Control-Allow-Origin *;
       add_header Cache-Control "public, no-cache";
       proxy_pass https://fss;
   }
   # mfe fss_backend application
   location /api/paymentsReference/ {
       proxy_redirect    off;
       proxy_set_header  Host $host;
       proxy_set_header  X-Real-IP $remote_addr;
       proxy_set_header  X-Forwarded-Proto http;
       proxy_set_header  X-Forwarded-For $remote_addr;
       proxy_set_header  X-Forwarded-Host $remote_addr;
       proxy_pass http://fss_backend;
   }

   # mfe base backend: Auth Service
   location /api/auth/ {
      rewrite ^/api/auth/(.*)$ /$1 break;
      proxy_redirect    off;
      proxy_set_header  Host $host;
      proxy_set_header  X-Real-IP $remote_addr;
      proxy_set_header  X-Forwarded-Proto http;
      proxy_set_header  X-Forwarded-For $remote_addr;
      proxy_set_header  X-Forwarded-Host $remote_addr;
      proxy_pass http://ratan_backend_api_gateway;
   }

   # mfe base backend: Log Service
   location /api/log/ {
      rewrite ^/api/log/(.*)$ /$1 break;
      proxy_redirect    off;
      proxy_set_header  Host $host;
      proxy_set_header  X-Real-IP $remote_addr;
      proxy_set_header  X-Forwarded-Proto http;
      proxy_set_header  X-Forwarded-For $remote_addr;
      proxy_set_header  X-Forwarded-Host $remote_addr;
      proxy_pass http://ratan_backend_bff;
   }

   # ratan backend: badkend for fronted Service
   location /api/ratan/bff/ {
      rewrite ^/api/ratan/bff/(.*)$ /$1 break;
      proxy_redirect    off;
      proxy_set_header  Host $host;
      proxy_set_header  X-Real-IP $remote_addr;
      proxy_set_header  X-Forwarded-Proto http;
      proxy_set_header  X-Forwarded-For $remote_addr;
      proxy_set_header  X-Forwarded-Host $remote_addr;
      proxy_pass http://ratan_backend_bff;
   }

   # ratan backend: stmcn GraphQL Service
   location /api/ratan/stmcn/v1/cashflows {
      proxy_redirect    off;
      proxy_set_header  Host $host;
      proxy_set_header  X-Real-IP $remote_addr;
      proxy_set_header  X-Forwarded-Proto http;
      proxy_set_header  X-Forwarded-For $remote_addr;
      proxy_set_header  X-Forwarded-Host $remote_addr;
      proxy_pass http://ratan_backend_api_gateway/graphql;
   }

   # ratan backend: socket Service
   location /api/ratan/socket/ {
      rewrite ^/api/ratan/socket/(.*)$ /$1 break;
      proxy_pass http://ratan_backend_bff;
      proxy_redirect    off;
      proxy_set_header  Host $host;
      proxy_set_header  X-Real-IP $remote_addr;
      proxy_set_header  X-Forwarded-Proto http;
      proxy_set_header  X-Forwarded-For $remote_addr;
      proxy_set_header  X-Forwarded-Host $remote_addr;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
   }

   # ratan backend: cashflow notification socket Service @Shuai
   location /api/ratan/notification/ {
       rewrite ^/api/ratan/notification/(.*)$ /$1 break;
       proxy_pass http://ratan_query_service;
       proxy_redirect    off;
       proxy_set_header  Host $host;
       proxy_set_header  X-Real-IP $remote_addr;
       proxy_set_header  X-Forwarded-Proto http;
       proxy_set_header  X-Forwarded-For $remote_addr;
       proxy_set_header  X-Forwarded-Host $remote_addr;
       proxy_http_version 1.1;
       proxy_set_header Upgrade $http_upgrade;
       proxy_set_header Connection "Upgrade";
   }

   # ratan backend: DA Service
   location /api/ratan/da/ {
       rewrite ^/api/ratan/da/(.*)$ /$1 break;
       proxy_redirect    off;
       proxy_set_header  Host $host;
       proxy_set_header  X-Real-IP $remote_addr;
       proxy_set_header  X-Forwarded-Proto http;
       proxy_set_header  X-Forwarded-For $remote_addr;
       proxy_set_header  X-Forwarded-Host $remote_addr;
       proxy_set_header  request-source nginx-direct;
       proxy_pass http://ratan_data_ambassador;
   }

   # ratan backend: api gateway Service
   location /api/ratan/ {
      rewrite ^/api/ratan/(.*)$ /$1 break;
      proxy_redirect    off;
      proxy_set_header  Host $host;
      proxy_set_header  X-Real-IP $remote_addr;
      proxy_set_header  X-Forwarded-Proto http;
      proxy_set_header  X-Forwarded-For $remote_addr;
      proxy_set_header  X-Forwarded-Host $remote_addr;
      proxy_pass http://ratan_backend_api_gateway;
   }

   location ~.*\.(json|html)$ {
      add_header Cache-Control no-store;
      add_header Pragma no-cache;
      root /apps/ratanrt/mfe/dist;
   }

   location / {

      error_page 500 404 402 403 405 501 503 /;
      add_header Access-Control-Allow-Origin *;
      add_header Cache-Control "public, no-cache";
      proxy_hide_header X-Powered-By;

      root /apps/ratanrt/mfe/dist;
      try_files $uri /index.html?$args;
      index index.html;
   }
}
