apiVersion: apps/v1
kind: Deployment
metadata:
  name: single-ui-bff
spec:
  template:
    spec:
      containers:
        - name: single-ui-bff
          env:
            - name: PORT
              value: "8080"
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
