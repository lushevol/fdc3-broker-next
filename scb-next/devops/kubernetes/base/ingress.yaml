apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: scb-next
  labels:
    app.kubernetes.io/part-of: scb-next
    scb-next.io/owner: platform
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: scb-next-edge
                port: { name: http }
