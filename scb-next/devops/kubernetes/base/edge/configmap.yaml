apiVersion: v1
kind: ConfigMap
metadata:
  name: scb-next-edge-config
  labels:
    app.kubernetes.io/name: scb-next-edge
    app.kubernetes.io/part-of: scb-next
    scb-next.io/owner: platform
data:
  proxy-headers.conf: |
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Original-URI $request_uri;
  default.conf.template: |
    map $http_upgrade $connection_upgrade {
      default upgrade;
      '' close;
    }

    upstream mfe_base { server ${MFE_BASE_UPSTREAM}; }
    upstream single_ui_bff { server ${SINGLE_UI_BFF_UPSTREAM}; }
    upstream portal_auth_service { server ${PORTAL_AUTH_SERVICE_UPSTREAM}; }
    upstream portal_tile_management_service { server ${PORTAL_TILE_MANAGEMENT_SERVICE_UPSTREAM}; }
    upstream portal_telemetry_service { server ${PORTAL_TELEMETRY_SERVICE_UPSTREAM}; }
    upstream ratan_edge { server ${RATAN_EDGE_UPSTREAM}; }

    server {
      listen 8080;
      server_name _;
      server_tokens off;
      client_max_body_size 1m;

      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options SAMEORIGIN always;
      add_header Referrer-Policy same-origin always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

      location = /healthz {
        access_log off;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"status":"ok","component":"scb-next-edge"}\n';
      }

      location ^~ /api/ratan/ {
        include /etc/nginx/scb-next/proxy-headers.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_pass http://ratan_edge;
      }
      location ^~ /static/ratan/ {
        include /etc/nginx/scb-next/proxy-headers.conf;
        proxy_pass http://ratan_edge;
      }
      location ^~ /remotes/ratan/ {
        include /etc/nginx/scb-next/proxy-headers.conf;
        proxy_pass http://ratan_edge;
      }
      location ^~ /remotes/cashflow/ {
        include /etc/nginx/scb-next/proxy-headers.conf;
        proxy_pass http://ratan_edge;
      }

      location ^~ /api/auth/v1/fmo/admin/ {
        rewrite ^/api/auth/(.*)$ /$1 break;
        include /etc/nginx/scb-next/proxy-headers.conf;
        proxy_pass http://portal_tile_management_service;
      }
      location ^~ /api/auth/ {
        rewrite ^/api/auth/(.*)$ /$1 break;
        include /etc/nginx/scb-next/proxy-headers.conf;
        proxy_pass http://portal_auth_service;
      }
      location ^~ /api/analytics/ {
        rewrite ^/api/analytics/(.*)$ /$1 break;
        include /etc/nginx/scb-next/proxy-headers.conf;
        proxy_pass http://portal_telemetry_service;
      }
      location ^~ /api/sso/ {
        rewrite ^/api/sso/(.*)$ /$1 break;
        include /etc/nginx/scb-next/proxy-headers.conf;
        proxy_pass http://portal_auth_service;
      }
      location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        include /etc/nginx/scb-next/proxy-headers.conf;
        proxy_pass http://single_ui_bff;
      }
      location / {
        include /etc/nginx/scb-next/proxy-headers.conf;
        proxy_pass http://mfe_base;
      }
    }
