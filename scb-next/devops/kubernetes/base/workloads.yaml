apiVersion: apps/v1
kind: Deployment
metadata:
  name: single-ui-bff
  labels: &bffLabels
    app.kubernetes.io/name: single-ui-bff
    app.kubernetes.io/component: platform-api
    app.kubernetes.io/part-of: scb-next
    scb-next.io/owner: platform
spec:
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/name: single-ui-bff } }
  template:
    metadata: { labels: *bffLabels }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: single-ui-bff
          image: registry.example.invalid/scb-next/single-ui-bff:replace-me
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
