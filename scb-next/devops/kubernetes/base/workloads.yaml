apiVersion: apps/v1
kind: Deployment
metadata:
  name: scb-next-edge
  labels: &edgeLabels
    app.kubernetes.io/name: scb-next-edge
    app.kubernetes.io/component: edge
    app.kubernetes.io/part-of: scb-next
    scb-next.io/owner: platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: scb-next-edge
  template:
    metadata:
      labels: *edgeLabels
    spec:
      automountServiceAccountToken: false
      securityContext: &podSecurity
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: scb-next-edge
      containers:
        - name: edge
          image: registry.example.invalid/scb-next/edge:replace-me
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - { name: MFE_BASE_UPSTREAM, value: "mfe-base:8080" }
            - { name: SINGLE_UI_BFF_UPSTREAM, value: "single-ui-bff:8080" }
            - { name: RATAN_EDGE_UPSTREAM, value: "ratan-edge:8080" }
          readinessProbe: &edgeProbe
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe: *edgeProbe
          resources: &edgeResources
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
          securityContext: &containerSecurity
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - { name: edge-config, mountPath: /etc/nginx/templates/default.conf.template, subPath: default.conf.template, readOnly: true }
            - { name: edge-config, mountPath: /etc/nginx/scb-next/proxy-headers.conf, subPath: proxy-headers.conf, readOnly: true }
            - { name: nginx-conf, mountPath: /etc/nginx/conf.d }
            - { name: nginx-cache, mountPath: /var/cache/nginx }
            - { name: nginx-run, mountPath: /var/run }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: edge-config
          configMap: { name: scb-next-edge-config }
        - { name: nginx-conf, emptyDir: {} }
        - { name: nginx-cache, emptyDir: {} }
        - { name: nginx-run, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
---
