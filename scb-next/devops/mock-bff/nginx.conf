events { worker_connections 128; }

http {
  server {
    listen 8081;
    server_name _;

    location = /api/auth/v2/sso/login {
      default_type application/json;
      error_page 418 =200 /mock-fixtures/login.json;
      return 418;
    }

    location = /api/auth/v2/sso/validate {
      default_type application/json;
      return 200 '{"result":true}';
    }

    location = /api/ratan/rule/v1/fields/versions {
      default_type application/json;
      return 200 '{"ratan_suppression_fields_config":{"activedVersion":"acceptance-v1"},"ratan_suppression_fields":{"activedVersion":"acceptance-v1"}}';
    }

    location = /api/ratan/rule/v1/fields {
      rewrite ^ /mock-fixtures/fields.json last;
    }

    location ~ ^/api/ratan/.*cashflows {
      error_page 418 =200 /mock-fixtures/cashflows.json;
      return 418;
    }

    location ^~ /mock-fixtures/ {
      internal;
      alias /etc/nginx/mock/fixtures/;
      default_type application/json;
      add_header Single-UI-Authorization "Bearer eyJhbGciOiJub25lIn0.eyJzdWIiOiJtb2NrLmNhc2hmbG93IiwiZXhwIjo0MTAyNDQ0ODAwLCJpYXQiOjE3MDAwMDAwMDB9." always;
    }

    location / {
      default_type application/json;
      return 200 '{"data":[],"items":[],"results":[],"total":0}';
    }
  }
}
